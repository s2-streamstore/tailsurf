[package]
name = "tailsurf-cli"
version.workspace = true
description = "Command line client for tail.surf live transcript streams"
edition.workspace = true
license.workspace = true
homepage = "https://tail.surf"
repository.workspace = true
keywords = ["streaming", "websocket", "transcript", "logs", "cli"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
readme = "../README.md"
rust-version.workspace = true

[[bin]]
name = "tsf"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
humantime.workspace = true
memchr.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt", "signal", "sync"] }
tailsurf = { version = "0.3.0", path = "../tailsurf" }
url.workspace = true

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }

[lints]
workspace = true
