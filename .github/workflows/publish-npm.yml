name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - protocol
          - client

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 's2-streamstore/tailsurf'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: typescript/.node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "npm packages must be published from main." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Pack package
        id: package
        env:
          PACKAGE_INPUT: ${{ inputs.package }}
        run: |
          package_name="@s2-dev/tailsurf-$PACKAGE_INPUT"
          package_version="$(node -p "require('./packages/$PACKAGE_INPUT/package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published." >&2
            exit 1
          fi
          if [[ "$PACKAGE_INPUT" == "client" ]]; then
            protocol_version="$(node -p "require('./packages/protocol/package.json').version")"
            npm view "@s2-dev/tailsurf-protocol@$protocol_version" version >/dev/null
          fi
          pnpm --filter "$package_name" pack --pack-destination "$RUNNER_TEMP"
          tarball_name="${package_name#@}"
          tarball_name="${tarball_name//\//-}-$package_version.tgz"
          echo "tarball=$RUNNER_TEMP/$tarball_name" >> "$GITHUB_OUTPUT"
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public
