name: Rust release PR

# Rust SDK and CLI pushes update the release PR. Crate publishing is gated in
# publish-crates.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "typescript/**"

jobs:
  release-pr:
    name: Prepare Rust SDK and CLI release PR
    if: github.repository == 's2-streamstore/tailsurf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Prepare Rust SDK and CLI release PR
        uses: release-plz/action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
