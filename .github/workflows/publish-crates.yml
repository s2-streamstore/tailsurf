name: Publish crates

# Release version bumps modify a Cargo manifest. Check crates.io before requesting approval.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - "**/Cargo.toml"
  workflow_dispatch:

jobs:
  check:
    name: Check for unpublished crates
    if: github.repository == 's2-streamstore/tailsurf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.crates.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Check crates.io
        id: crates
        shell: bash
        run: |
          set -euo pipefail
          should_publish=false
          while IFS=$'\t' read -r name version; do
            status="$(curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'User-Agent: tailsurf-release-check (https://github.com/s2-streamstore/tailsurf)' "https://crates.io/api/v1/crates/${name}/${version}")"
            case "$status" in
              200)
                echo "${name} ${version} is already published"
                ;;
              404)
                echo "${name} ${version} is ready to publish"
                should_publish=true
                ;;
              *)
                echo "crates.io returned HTTP ${status} for ${name} ${version}" >&2
                exit 1
                ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select((.publish == null) or (.publish | index("crates-io"))) | [.name, .version] | @tsv')
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"

  release:
    name: Publish crates
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Publish release
        id: release-plz
        uses: release-plz/action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release artifacts
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(jq -er '[.[].version] | unique | if length == 1 then "v\(.[0])" else error("release versions are not coordinated") end' <<<"$RELEASES")"
          jq -n --arg tag "$tag" '{event_type: "release", client_payload: {tag: $tag}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
