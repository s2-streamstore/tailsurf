[package]
name = "tailsurf"
version.workspace = true
description = "Rust SDK for tail.surf live transcript streams"
edition.workspace = true
license.workspace = true
homepage = "https://tail.surf"
repository.workspace = true
documentation = "https://docs.rs/tailsurf"
keywords = ["streaming", "websocket", "transcript", "logs"]
categories = ["api-bindings", "asynchronous", "network-programming"]
readme = "../README.md"
rust-version.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
memchr.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
ubid.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
